<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tidak ada koneksi — Jadwal Seleksi</title>
<style>
  :root { color-scheme: dark light; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh;
    display: grid; place-items: center; padding: 24px;
    background: #0b0e13; color: #e8ebf2;
    font-family: "IBM Plex Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
    line-height: 1.5;
  }
  @media (prefers-color-scheme: light) { body { background: #f2f4f7; color: #14171c; } }
  .kotak { max-width: 380px; text-align: center; }
  .ikon { width: 56px; height: 56px; margin: 0 auto 20px; border-radius: 14px; background: #10b981; display: grid; place-items: center; }
  h1 { margin: 0 0 8px; font-size: 18px; font-weight: 600; letter-spacing: -0.01em; }
  p { margin: 0 0 20px; font-size: 13.5px; color: #98a1b2; }
  @media (prefers-color-scheme: light) { p { color: #5f6774; } }
  button {
    font-family: inherit; font-size: 13.5px; font-weight: 500;
    padding: 10px 20px; border-radius: 8px; border: none; cursor: pointer;
    background: #10b981; color: #052e1f;
  }
  button:active { transform: scale(0.98); }
</style>
</head>
<body>
  <div class="kotak">
    <div class="ikon" aria-hidden="true">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="#fff">
        <rect x="3" y="5" width="9.5" height="3.4" rx="1.7"/>
        <rect x="8" y="10.3" width="12" height="3.4" rx="1.7"/>
        <rect x="5.5" y="15.6" width="8" height="3.4" rx="1.7"/>
      </svg>
    </div>
    <h1>Tidak ada koneksi</h1>
    <p>
      Jadwal tidak ditampilkan dari salinan lama — tanggal yang sudah kedaluwarsa
      lebih berbahaya daripada halaman kosong. Sambungkan internet lalu coba lagi.
    </p>
    <button type="button" onclick="location.reload()">Coba lagi</button>
  </div>
</body>
</html>
